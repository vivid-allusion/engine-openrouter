id = "gemini-2.0-flash"
label = "Gemini 2.0 Flash"
category = "TXT"
platform = "openrouter"
endpoint = "google/gemini-2.0-flash-001"
description = "Google's Gemini 2.0 Flash. Fast and affordable text generation."

[pricing]
type = "real_time"
input = 0.10
output = 0.40
currency = "USD per 1M tokens"

[params.temperature]
label = "Temperature"
type = "number"
default = 0.5
min = 0.0
max = 2.0
step = 0.1

[params.max_tokens]
label = "Max Output Tokens"
type = "integer"
default = 4096
min = 1
max = 200000
