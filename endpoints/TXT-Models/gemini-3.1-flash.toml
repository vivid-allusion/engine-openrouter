id = "gemini-3.1-flash"
label = "Gemini 3.1 Flash"
category = "TXT"
platform = "openrouter"
endpoint = "google/gemini-3.1-flash-lite-preview"
description = "Google's Gemini 3.1 Flash Lite. Fastest Gemini for text tasks."

[pricing]
type = "real_time"
input = 0.10
output = 0.40
currency = "USD per 1M tokens"

[params.temperature]
label = "Temperature"
type = "number"
default = 0.5
min = 0.0
max = 2.0
step = 0.1

[params.max_tokens]
label = "Max Output Tokens"
type = "integer"
default = 4096
min = 1
max = 200000
