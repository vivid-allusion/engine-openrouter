[project]
name = "engine-openrouter"
version = "0.1.0"
description = "Engine wrapper for the OpenRouter API (OpenAI-compatible). Uniform interface that studiolot Vehicles call instead of importing the OpenAI SDK directly."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["engine_openrouter"]

[tool.setuptools.package-data]
engine_openrouter = ["endpoints/**/*.toml", "endpoints/**/*.gitkeep"]
